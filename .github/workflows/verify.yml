name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: SQLite development headers for the effect journal
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Staticcheck (packages under the Go Language Profile)
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./internal/institution/... ./internal/ingress/... ./cmd/institution-turn ./cmd/census-turn ./cmd/occupant-chat ./cmd/heartime-ingress ./cmd/planning-turn
      - name: Tests with race detector
        run: go test -race -count=1 ./...
